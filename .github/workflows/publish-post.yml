name: 記事をブログに公開

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    # リポジトリ所有者本人の投稿だけをブログへ公開する
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[記事]')
    runs-on: ubuntu-latest
    steps:
      - name: ブログを読み込む
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 記事ファイルを作る
        id: post
        run: python scripts/publish_issue.py

      - name: 記事を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "記事を公開: ${{ steps.post.outputs.title }}"
          git pull --rebase origin main
          git push

      - name: 完了を知らせる
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `記事を公開しました。数分後に https://zuka-0123.github.io/ に表示されます。`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
