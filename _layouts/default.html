<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17233d" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
    {% seo %}
    {% feed_meta %}
    <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ブログ投稿">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}">{% endif %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    {% if page.extra_js %}<script src="{{ page.extra_js | relative_url }}" defer></script>{% endif %}
  </head>
  <body id="top">
    <a class="skip-link" href="#main">本文へ移動</a>
    {% include header.html %}
    <main id="main" class="shell main-content">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
