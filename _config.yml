title: ゆるくなんかかく
description: 勉強したことやしてないことなど書くかもしれません
author: zuka-0123
url: "https://zuka-0123.github.io"
baseurl: ""
lang: ja
timezone: Asia/Tokyo

permalink: /diary/:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
